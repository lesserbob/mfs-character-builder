openapi: 3.0.0
info:
  title: Character Builder API
  description: API for managing characters and their stats
  version: 1.0.0
  contact:
    name: Character Builder Team
servers:
  - url: http://localhost:3001
    description: Development server
paths:
  /creature:
    get:
      summary: Get all creature
      description: Retrieve a list of all creatures
      operationId: getCreatures
      responses:
        '200':
          description: List of creatures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/creature'
    post:
      summary: Create a new create
      description: Create a new creature with basic information
      operationId: createCreature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createCreatureRequest'
      responses:
        '201':
          description: Creature created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creature'
  /creature/{id}:
    get:
      summary: Get creature by ID
      description: Retrieve a specific creature by their ID
      operationId: getCreatureById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Creature ID
      responses:
        '200':
          description: Creature found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creature'
        '404':
          description: creature not found
    put:
      summary: Update creature
      description: Update an existing creature's information
      operationId: updateCreature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Creature ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateCreatureRequest'
      responses:
        '200':
          description: Creature updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creature'
    delete:
      summary: Delete creature
      description: Delete a creature and all associated data
      operationId: deleteCreature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Creature ID
      responses:
        '204':
          description: Creature deleted successfully
components:
  schemas:
    creature:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the creature
        name:
          type: string
          description: creature name
        level:
          type: integer
          description: creature level
          default: 1
      required:
        - name
        - level
    createCreatureRequest:
      type: object
      properties:
        name:
          type: string
          description: Creature name
        level:
          type: integer
          description: Creature level
          default: 1
        might:
          type: integer
          description: Might attribute
          default: 0
        agility:
          type: integer
          description: Agility attribute
          default: 0
        intellect:
          type: integer
          description: Intellect attribute
          default: 0
        spirit:
          type: integer
          description: Spirist attribute
          default: 0
      required:
        - name
        - level
    updateCreatureRequest:
      type: object
      properties:
        name:
          type: string
          description: Creature name
        level:
          type: integer
          description: Creature level