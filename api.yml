openapi: 3.0.0
info:
  title: Character Builder API
  description: API for managing characters and their stats for SLA Roll 12
  version: 1.0.0
  contact:
    name: SLA Roll 12
servers:
  - url: ${API_URL:-http://localhost:3001}
    description: Development server
security:
  - bearerAuth: []
paths:
  /creature:
    get:
      summary: Get all creature
      description: Retrieve a list of all creatures
      operationId: getCreatures
      parameters:
        - name: type
          in: query
          description: Filter by creature type
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of creatures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/creature'
    post:
      summary: Create a new creature
      description: Create a new creature with basic information
      operationId: createCreature
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createCreatureRequest'
      responses:
        '201':
          description: Creature created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the creature
  /creature/{id}:
    get:
      summary: Get creature by ID
      description: Retrieve a specific creature by their ID
      operationId: getCreatureById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Creature ID
      responses:
        '200':
          description: Creature found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creature'
        '404':
          description: creature not found
    put:
      summary: Update creature
      description: Update an existing creature's information
      operationId: updateCreature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Creature ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateCreatureRequest'
      responses:
        '200':
          description: Creature updated successfully
    delete:
      summary: Delete creature
      description: Delete a creature and all associated data
      operationId: deleteCreature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Creature ID
      responses:
        '204':
          description: Creature deleted successfully
  /class:
    get:
      summary: Get all classes
      description: Retrieve a list of all classes
      operationId: getClasses
      parameters:
        - name: classification
          in: query
          required: false
          schema:
            type: string
            enum: [RACE, PATH, SPECIALISATION]
          description: Filter classes by classification type
        - name: includeLevels
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include class levels in the response
      responses:
        '200':
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/class'
  /class/{id}:
    get:
      summary: Get class by ID
      description: Retrieve a specific class by ID with optional levels
      operationId: getClassById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Class ID
        - name: includeLevels
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include class levels in the response
      responses:
        '200':
          description: Class found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/class'
        '404':
          description: Class not found
  /class/selectableFeatureList/{id}:
    get:
      summary: Get selectable feature list by ID
      description: Retrieve a specific selectable feature list by ID
      operationId: getSelectableFeatureListById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Selectable Feature List ID
      responses:
        '200':
          description: Selectable feature list found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/selectableFeatureList'
        '404':
          description: Selectable feature list not found
  /item:
    get:
      summary: Get all items
      description: Retrieve a list of all items
      operationId: getItems
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/item'
  /story:
    get:
      summary: Get all stories
      description: Retrieve a list of all stories
      operationId: getStories
      responses:
        '200':
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/story'
    post:
      summary: Create a new story
      description: Create a new story with basic information
      operationId: createStory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/storyBase'
      responses:
        '201':
          description: Story created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the story
  /story/{id}:
    get:
      summary: Get story by ID
      description: Retrieve a specific story by their ID
      operationId: getStoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Story ID
      responses:
        '200':
          description: Story found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/story'
        '404':
          description: story not found
  /story/{id}/location:
    get:
      summary: Get locations by story ID
      description: Retrieve all locations for the given story
      operationId: getLocationsByStoryId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Story ID
      responses:
        '200':
          description: Locations within story
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/location'
        '404':
          description: story not found
    post:
      summary: Create a new location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      description: Create a new location with basic information
      operationId: createLocation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locationBase'
      responses:
        '201':
          description: Location created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the location
  /story/{id}/addActorAgent:
    post:
      summary: Agent to add actors to a story
      description: Agent to add actors to a story
      operationId: addActors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Story ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/addActorInstruction'
      responses:
        '200':
          description: Story found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/story'
        '404':
          description: story not found
  /story/{id}/actor:
    get:
      summary: Get actors by story ID
      description: Retrieve all actors for the given story
      operationId: getActorsByStoryId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Story ID
      responses:
        '200':
          description: Actors within story
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/actor'
        '404':
          description: story not found
  /story/{id}/searchForActorAgent:
    get:
      summary: Search for creatures appropriate for adding to a story zone
      description: Search for creatures appropriate for adding to a story zone
      operationId: getCreaturesForStory
      parameters:
        - name: id
          in: path
          description: Story to add creatures to
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of creatures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/creature'
  /location/{locationId}:
    get:
      summary: Get location by ID
      description: Retrieve all locations for the given story
      operationId: getLocationById
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
          description: Location ID
      responses:
        '200':
          description: Location within story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/location'
        '404':
          description: story not found
    put:
      summary: Update location
      description: Update an existing location information
      operationId: updateLocation
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
          description: Location ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/location'
      responses:
        '200':
          description: Location updated successfully
  /actor/{actorId}:
    put:
      summary: Update actor
      description: Update an existing actor information
      operationId: updateActor
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: integer
          description: Location ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/actor'
      responses:
        '200':
          description: Actor updated successfully
  /gameLog:
    post:
      summary: Create a new log message
      description: Create a new log message
      operationId: postLogMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/logMessage'
      responses:
        '200':
          description: Log message added
    get:
      summary: Get messages
      description: Retrieve all messages
      operationId: getLogMessages
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/logMessage'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    creature:
      allOf:
        - $ref: '#/components/schemas/creatureBase'
        - type: object
          properties:
            id:
              type: integer
              description: Unique identifier for the creature
          required:
            - id
    creatureBase:
      type: object
      properties:
        name:
          type: string
          description: creature name
        level:
          type: integer
          description: creature level
          default: 1
        might:
          type: integer
          description: Might attribute
          default: 0
        agility:
          type: integer
          description: Agility attribute
          default: 0
        intellect:
          type: integer
          description: Intellect attribute
          default: 0
        spirit:
          type: integer
          description: Spirit attribute
          default: 0
        wealth:
          type: integer
          description: Wealth attribute
          default: 0
        classes:
          type: array
          description: List of class IDs the creature has
          items:
            type: integer
            description: Class ID
        features:
          type: array
          description: List of feature IDs the creature has
          items:
            type: integer
            description: Feature ID
        items:
          type: array
          description: List of item IDs the creature has
          items:
            type: object
            properties:
              itemId:
                type: integer
                description: Item ID
              quantity:
                type: integer
                description: Number of items the creature has
            required:
              - itemId
              - quantity
        portrait:
          type: string
          description: creature portrait
        type:
          type: string
          description: creature type
        baseHealth:
          type: integer
          description: creature base health (not including health from classes)
        bespokeFeatures:
          type: array
          description: List of bespoke features for this creature
          items:
            $ref: '#/components/schemas/creatureBespokeFeature'
      required:
        - id
        - name
        - level
        - classes
        - features
        - items
        - bespokeFeatures
    createCreatureRequest:
      $ref: '#/components/schemas/creatureBase'
    updateCreatureRequest:
      $ref: '#/components/schemas/creature'
    creatureBespokeFeature:
      type: object
      properties:
        name:
          type: string
          description: feature name
        description:
          type: string
          description: feature description
    class:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the class
        name:
          type: string
          description: class name
        classification:
          type: string
          description: class classification
          enum: [RACE, PATH, SPECIALISATION]
        minMight:
          type: integer
          nullable: true
          description: minimum might required to select this class
        minAgility:
          type: integer
          nullable: true
          description: minimum agility required to select this class
        minIntellect:
          type: integer
          nullable: true
          description: minimum intellect required to select this class
        minSpirit:
          type: integer
          nullable: true
          description: minimum spirit required to select this class
        classLevels:
          type: array
          description: List of levels for this class
          items:
            $ref: '#/components/schemas/classLevel'
      required:
        - id
        - name
        - classification
    classLevel:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the class level
        classId:
          type: integer
          description: ID of the class this level belongs to
        level:
          type: integer
          description: The level number
        health:
          type: integer
          description: Health points at this level
        statBonus:
          type: integer
          description: Stat bonus at this level
          default: 0
        features:
          type: array
          description: List of features available at this level
          items:
            $ref: '#/components/schemas/classFeature'
      required:
        - id
        - classId
        - level
        - health
    classFeature:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the class feature
        name:
          type: string
          description: Name of the feature
        description:
          type: string
          description: Description of the feature
        type:
          type: string
          description: Type of the feature
          enum: [BASE, SELECT]
        enduranceRegeneration:
          type: integer
          nullable: true
          description: Endurance regeneration for this feature
        selectableListId:
          type: integer
          nullable: true
          description: ID of the selectable list for this feature
        selectableCount:
          type: integer
          nullable: true
          description: Number of selectable items for this feature
        display:
          type: boolean
          description: Whether to display this feature in the UI
      required:
        - id
        - name
        - description
    selectableFeatureList:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the selectable feature list
        name:
          type: string
          description: Name of the selectable feature list
        features:
          type: array
          description: List of selectable features
          items:
            $ref: '#/components/schemas/selectableFeature'
      required:
        - id
        - name
    selectableFeature:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the selectable feature
        name:
          type: string
          description: Name of the selectable feature
        description:
          type: string
          description: Description of the selectable feature
        requiredSelectableFeatureId:
          type: integer
          nullable: true
          description: ID of the required selectable feature
        actionType:
          type: string
          nullable: true
          description: Action type of the selectable feature
          enum: [STANDARD, MINOR, REACTION, FREE, MOVE]
        uses:
          type: integer
          nullable: true
          description: Number of uses for the selectable feature
      required:
        - id
        - name
        - description
    item:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the item
        name:
          type: string
          description: Name of the item
        type:
          type: string
          description: Type of the item
          enum: [MELEE, RANGED, ARMOR, MISCELLANEOUS]
        rank:
          type: integer
          description: Rank of the item
        damageUnarmored:
          type: integer
          nullable: true
          description: Damage of the item when unarmored
        damageArmored:
          type: integer
          nullable: true
          description: Damage of the item when armored
        concealable:
          type: boolean
          description: Whether the item can be concealed
        twoHanded:
          type: boolean
          description: Whether the item is two-handed
        reach:
          type: boolean
          description: Whether the item has reach
        finesse:
          type: boolean
          description: Whether the item is a finesse weapon
        thrown:
          type: boolean
          description: Whether the item is thrown
        attacksWorthOfAmmo:
          type: integer
          nullable: true
          description: Number of attacks worth of ammo
        rateOfFire:
          type: string
          nullable: true
          description: Rate of fire of the item
          enum: [SINGLE, BURST, FULL_AUTO, SEMI_AUTO]
        range:
          type: string
          nullable: true
          description: Range of the item
          enum: [NEARBY, MEDIUM, LONG, EXTREME]
        reliability:
          type: string
          nullable: true
          description: Reliability of the item
          enum: [RELIABLE, NORMAL, UNRELIABLE]
        scatter:
          type: boolean
          description: Whether the item can be scattered
        sniper:
          type: boolean
          description: Whether the item is a sniper weapon
        brace:
          type: boolean
          description: Whether the item is a brace weapon
        armorType:
          type: string
          nullable: true
          description: Type of armor the item is
          enum: [OUTFIT, HARDENED]
        soak:
          type: integer
          nullable: true
          description: Soak of the item
      required:
        - id
    story:
      allOf:
        - $ref: '#/components/schemas/storyBase'
        - type: object
          properties:
            id:
              type: integer
              description: Unique identifier for the story
          required:
            - id
    storyBase:
      type: object
      properties:
        name:
          type: string
          description: Name of the story
        description:
          type: string
          description: Description of the story
    location:
      allOf:
        - $ref: '#/components/schemas/locationBase'
        - type: object
          properties:
            id:
              type: integer
              description: Unique identifier for the location
          required:
            - id
    locationBase:
      type: object
      properties:
        name:
          type: string
          description: Name of the location
        description:
          type: string
          description: Description of the location
        storyId:
          type: number
          description: Story this location belongs to
        zones:
          type: array
          description: List of zones
          items:
            $ref: '#/components/schemas/zone'
        actingFaction:
          type: string
          description: which faction is currently acting
          nullable: true
    zone:
      allOf:
        - $ref: '#/components/schemas/zoneBase'
        - type: object
          properties:
            id:
              type: integer
              description: Unique identifier for the zone
          required:
            - id
    zoneBase:
      type: object
      properties:
        name:
          type: string
          description: Name of the zone
        description:
          type: string
          description: Description of the zone
        xpos:
          type: integer
          description: relative xposition of the zone
        ypos:
          type: integer
          description: relative yposition of the zone
        actors:
          type: array
          description: List of actors
          items:
            $ref: '#/components/schemas/actor'
      required:
        - name
        - xpos
        - ypos
        - actors
    addActorInstruction:
      type: object
      properties:
        creatureId:
          type: integer
          description: id of the creature to be added
        count:
          type: integer
          description: count of creatures to add
        zoneId:
          type: integer
          description: Zone id when adding to zone
    actor:
      type: object
      properties:
        id:
          type: integer
          description: id of actor
        creatureId:
          type: integer
          description: Creature id of actor
        creature:
          description: The creature
          $ref: '#/components/schemas/creature'
        zoneId:
          type: integer
          description: The zone (if any) the creature is currently in
        enduranceDamage:
          type: integer
          description: The amount of endurance the actor has lost
        healthDamage:
          type: integer
          description: The amount of health the actor has lost
        momentumSpent:
          type: integer
          description: The amount of momentum the actor has lost
        actionPoints:
          type: integer
          description: The amount of action points the actor has
        standardActions:
          type: integer
          description: The amount of standard actions the actor has
        tacticalSurgeToken:
          type: boolean
          description: Whether the acotr can attempt a tactical surge
        tacticalActionsTaken:
          type: integer
          description: The unmber of tactical surges taken this combat
        acting:
          type: boolean
          description: flag to indicate that the actor is currently acting
      required:
        - id
        - creatureId
        - zoneId
        - enduranceDamage
        - healthDamage
        - momentumSpent
        - actionPoints
        - standardActions
        - tacticalSurgeToken
        - tacticalActionsTaken
        - acting
    logMessage:
      type: object
      properties:
        id:
          type: integer
          description: id of message
        userName:
          type: string
          description: name of originating user
        logMessage:
          type: string
          description: the message
